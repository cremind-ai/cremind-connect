name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            web/package-lock.json
      - run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Test
        run: npm test
      # Install + build the marketing site so PRs catch any Next.js/export
      # breakage, and so the assets dir exists for the deploy dry-run below.
      - run: npm ci --prefix web
      - name: Web build
        run: npm run web:build
      - name: Deploy dry-run (bundle check)
        run: npm run deploy:dry
